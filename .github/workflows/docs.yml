name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - 'natch_docs_v.3.4.[1-9]*'
      - 'natch_docs_v.3.[5-9]*'
      - 'natch_docs_v.[4-9]*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: documentation-pages
  cancel-in-progress: false


jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Получаем весь Git history + tags
      # ------------------------------------------------------------
      - name: Checkout Complete History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------------
      # 3. Dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      # ------------------------------------------------------------
      # 4. Явно обновляем refs
      # ------------------------------------------------------------
      - name: Fetch branches and tags
        run: |
          git fetch origin --prune
          git fetch origin --tags --force

          # echo "Current ref:"
          # git describe --always --decorate

          echo
          echo "Documentation tags:"
          git tag --list 'natch_docs_v.*' | sort -V

      # ------------------------------------------------------------
      # 5. Полная сборка всех версий
      # ------------------------------------------------------------
      - name: Build Multi-Version Documentation
        run: |
          rm -rf final_site

          sphinx-multiversion docs final_site

        env:
          SPHINX_MULTIVERSION_PRE_BUILD_REF: ${{ github.ref }}


      # ------------------------------------------------------------
      # 6. Проверяем результат sphinx-multiversion
      # ------------------------------------------------------------
      - name: Show Built Versions
        run: |

          echo "===== GENERATED VERSION DIRECTORIES ====="

          find final_site \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%f\n' |
            sort


      # ------------------------------------------------------------
      # 7. Находим последний релиз
      # ------------------------------------------------------------
      - name: Find Latest Release
        run: |

          LATEST_RELEASE=$(
            git tag --list 'natch_docs_v.*' |
            grep -E '^natch_docs_v\.(3\.4\.[1-9][0-9]*|3\.[5-9][0-9]*(\.[0-9]+)?|[4-9][0-9]*(\.[0-9]+)?)$' |
            sort -V |
            tail -n 1
          )

          # LATEST_RELEASE=$(
          #   git tag --list 'natch_docs_v.*' |
          #   grep -E '^natch_docs_v\.[0-9]+\.[0-9]+(\.[0-9]+)?$' |
          #   sort -V |
          #   tail -n 1
          # )

          if [ -z "$LATEST_RELEASE" ]; then
            echo "WARNING: No release tag found."
            LATEST_RELEASE="main"
          fi

          echo "Latest release: $LATEST_RELEASE"

          echo "LATEST_RELEASE=$LATEST_RELEASE" >> "$GITHUB_ENV"


      # ------------------------------------------------------------
      # 8. Проверяем, что релиз действительно собран
      # ------------------------------------------------------------
      - name: Verify Latest Release
        run: |

          echo "Checking:"
          echo "final_site/${LATEST_RELEASE}/index.html"

          if [ ! -f "final_site/${LATEST_RELEASE}/index.html" ]; then

            echo
            echo "ERROR: Latest release was not generated!"
            echo

            echo "Expected:"
            echo "final_site/${LATEST_RELEASE}/index.html"

            echo
            echo "Available directories:"

            find final_site \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' |
              sort

            exit 1
          fi

          echo "OK: release exists"


      # ------------------------------------------------------------
      # 9. Root redirect
      # ------------------------------------------------------------
      - name: Create Root Redirect
        run: |

          cat > final_site/index.html <<EOF
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">

              <title>Natch documentation</title>

              <meta
                http-equiv="refresh"
                content="0; url=./${LATEST_RELEASE}/index.html"
              >

              <link
                rel="canonical"
                href="./${LATEST_RELEASE}/index.html"
              >
            </head>

            <body>
              <p>
                Redirecting to
                <a href="./${LATEST_RELEASE}/index.html">
                  Natch documentation ${LATEST_RELEASE}
                </a>...
              </p>
            </body>
          </html>
          EOF


      # ------------------------------------------------------------
      # 10. КРИТИЧЕСКАЯ ПРОВЕРКА
      # ------------------------------------------------------------
      - name: Verify Final Site
        run: |

          echo "===== FINAL SITE ROOT ====="

          find final_site \
            -mindepth 1 \
            -maxdepth 1 \
            -printf '%f\n' |
            sort

          echo
          echo "===== RELEASE INDEX ====="

          ls -lh \
            "final_site/${LATEST_RELEASE}/index.html"

          echo
          echo "===== ROOT REDIRECT ====="

          cat final_site/index.html


      # ------------------------------------------------------------
      # 11. Публикуем Pages Artifact
      # ------------------------------------------------------------
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: final_site


  # ==============================================================
  # DEPLOY
  # ==============================================================

  # deploy:
  #   name: Deploy to GitHub Pages

  #   runs-on: ubuntu-latest

  #   needs: build

  #   permissions:
  #     pages: write
  #     id-token: write

  #   environment:
  #     name: github-pages
  #     url: ${{ steps.deployment.outputs.page_url }}

  #   steps:

  #     - name: Deploy
  #       id: deployment
  #       uses: actions/deploy-pages@v4

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployment URL
        run: |
          echo "DEPLOYED TO:"
          echo "${{ steps.deployment.outputs.page_url }}"
