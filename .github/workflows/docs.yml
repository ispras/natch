name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - 'natch_docs_v.3.4.[1-9]*'
      - 'natch_docs_v.3.[5-9]*'
      - 'natch_docs_v.[4-9]*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Complete History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Скачиваем всю историю и теги

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Load Extant Versions From Storage
        run: |
          # 1. Скачиваем старый сайт СРАЗУ в целевую папку сборки
          git clone --branch gh-pages https://github.com/${{ github.repository }}.git docs/_build/html || true
          # Удаляем внутреннюю папку .git старого сайта, чтобы она не мешала нашей работе
          rm -rf docs/_build/html/.git

      - name: Build Multi-Version HTML
        run: |
          # 2. Запускаем сборку. Sphinx запишет текущие ветку/тег поверх старых папок,
          # сохранив при этом все ранее опубликованные версии релизов!
          sphinx-multiversion docs docs/_build/html

      - name: Create Root Redirect
        run: |
          # 3. Синхронизируем теги
          git fetch --tags --force

          # 4. Ищем последний актуальный релиз
          LATEST_RELEASE=$(
            git tag --list 'natch_docs_v*' |
            grep -E '^natch_docs_v\.(3\.4\.[1-9][0-9]*|3\.[5-9][0-9]*(\.[0-9]+)?|[4-9][0-9]*(\.[0-9]+)?)$' |
            sort -V |
            tail -n 1
          )

          if [ -z "$LATEST_RELEASE" ]; then
            LATEST_RELEASE="main"
            echo "WARNING: Не найден ни один релизный тег, используем main"
          fi

          echo "Последний актуальный релиз для редиректа определен как: $LATEST_RELEASE"

          # 5. Принудительно перезаписываем корневой index.html на актуальный релиз
          cat <<EOF > docs/_build/html/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Natch documentation</title>
              <meta http-equiv="refresh" content="0; url=./${LATEST_RELEASE}/index.html">
              <link rel="canonical" href="./${LATEST_RELEASE}/index.html">
            </head>
            <body>
              <p>
                Redirecting to
                <a href="./${LATEST_RELEASE}/index.html">
                  Natch documentation ${LATEST_RELEASE}
                </a>...
              </p>
            </body>
          </html>
          EOF

      - name: Save Versions Back to Storage Branch
        uses: Actions-js/push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          directory: docs/_build/html
          force: true
          message: "Добавление/обновление версий документации [skip ci]"

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
          overwrite: true

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
