name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - 'natch_docs_v.3.4.[1-9]*'
      - 'natch_docs_v.3.[5-9]*'
      - 'natch_docs_v.[4-9]*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: documentation-pages
  cancel-in-progress: false


jobs:
  build:
    name: Build and deploy documentation
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ------------------------------------------------------------
      # 1. Получаем весь Git history + tags
      # ------------------------------------------------------------
      - name: Checkout Complete History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------------
      # 3. Dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      # ------------------------------------------------------------
      # 4. Явно обновляем refs
      # ------------------------------------------------------------
      - name: Fetch branches and tags
        run: |
          # 1. Скачиваем обновления веток
          git fetch origin main --prune
          git fetch origin "+refs/tags/*:refs/tags/*" --force

          # 2. Обновляем локальную ветку main при пуше тегов
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Triggered by a tag. Forcing local main branch update..."
            git branch -f main origin/main
          fi

          echo
          echo "Доступные теги локально на диске:"
          git tag --list 'natch_docs_v.*' | sort -V
          echo
          echo "Доступные локальные ветки:"
          git branch --list



      # ------------------------------------------------------------
      # 5. Configure GitHub Pages
      # ------------------------------------------------------------
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # ------------------------------------------------------------
      # 6. Полная сборка всех версий
      # ------------------------------------------------------------
      - name: Build Multi-Version Documentation
        run: |
          rm -rf final_site

          sphinx-multiversion docs final_site


      # ------------------------------------------------------------
      # 7. Проверяем результат sphinx-multiversion
      # ------------------------------------------------------------
      - name: Show Built Versions
        run: |
          echo "===== GENERATED VERSION DIRECTORIES ====="

          find final_site \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%f\n' |
            sort

          echo
          echo "===== CURRENT ROOT ====="

          find final_site \
            -mindepth 1 \
            -maxdepth 1 \
            -printf '%f\n' |
            sort


      # ------------------------------------------------------------
      # 8. Находим последний релиз
      # ------------------------------------------------------------
      - name: Find Latest Release
        run: |

          LATEST_RELEASE=$(
            git tag --list 'natch_docs_v.*' |
            grep -E '^natch_docs_v\.(3\.4\.[1-9][0-9]*|3\.[5-9][0-9]*(\.[0-9]+)?|[4-9][0-9]*(\.[0-9]+)?)$' |
            sort -V |
            tail -n 1
          )

          if [ -z "$LATEST_RELEASE" ]; then
            echo "WARNING: No release tag found."
            LATEST_RELEASE="main"
          fi

          echo "Latest release: $LATEST_RELEASE"

          echo "LATEST_RELEASE=$LATEST_RELEASE" >> "$GITHUB_ENV"


      # ------------------------------------------------------------
      # 9. Проверяем, что релиз действительно собран
      # ------------------------------------------------------------
      - name: Verify Latest Release
        run: |

          RELEASE_INDEX="final_site/${LATEST_RELEASE}/index.html"

          echo "Checking:"
          echo "$RELEASE_INDEX"

          if [ ! -f "$RELEASE_INDEX" ]; then
            echo
            echo "ERROR: Latest release was not generated!"
            echo
            echo "Expected:"
            echo "$RELEASE_INDEX"
            echo
            echo "Available directories:"

            find final_site \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' |
              sort

            exit 1
          fi

          echo
          echo "OK: release exists"
          ls -lh "$RELEASE_INDEX"


      # ------------------------------------------------------------
      # 10. Root redirect (С защитой от кэширования браузером)
      # ------------------------------------------------------------
      - name: Create Root Redirect
        run: |


          echo $(pwd)
          cat > final_site/index.html <<EOF
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="Status" content="200">
              <meta http-equiv="content-security-policy" content="default-src 'self'">
              <title>Natch documentation</title>

              <!-- Запрещаем кэширование страницы перенаправления -->
              <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
              <meta http-equiv="Pragma" content="no-cache">
              <meta http-equiv="Expires" content="0">

              <meta http-equiv="refresh" content="0; url=${LATEST_RELEASE}/index.html">
              <link rel="canonical" href="${LATEST_RELEASE}/index.html">
            </head>

            <body>
              <p>
                Redirecting to
                <a href="${LATEST_RELEASE}/index.html">
                  Natch documentation ${LATEST_RELEASE}
                </a>...
              </p>
            </body>
          </html>
          EOF


      # ------------------------------------------------------------
      # 11. КРИТИЧЕСКАЯ ПРОВЕРКА
      # ------------------------------------------------------------
      - name: Verify Final Site
        run: |

          echo "======================================"
          echo "FINAL SITE ROOT"
          echo "======================================"

          find final_site \
            -mindepth 1 \
            -maxdepth 1 \
            -printf '%f\n' |
            sort

          echo
          echo "======================================"
          echo "LATEST RELEASE"
          echo "======================================"

          echo "$LATEST_RELEASE"

          echo
          echo "======================================"
          echo "RELEASE INDEX"
          echo "======================================"

          ls -lh \
            "final_site/${LATEST_RELEASE}/index.html"

          echo
          echo "======================================"
          echo "ROOT INDEX"
          echo "======================================"

          cat final_site/index.html

      # ------------------------------------------------------------
      # 11.5. Сбрасываем контекст Git, чтобы upload-pages-artifact не терял файлы
      # ------------------------------------------------------------
      - name: Reset Git context before upload
        run: |
          # Удаляем внутреннюю папку .git текущего воркспейса.
          # Это превратит всю рабочую директорию в обычный набор файлов.
          # Экшен upload-pages-artifact больше не будет смотреть на правила Git,
          # detached HEAD или .gitignore, а просто упакует папку final_site.
          rm -rf .git
          echo "Git metadata removed. Ready for complete upload."

      # ------------------------------------------------------------
      # 12. Загружаем final_site в Pages artifact
      # ------------------------------------------------------------

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: final_site


      # ------------------------------------------------------------
      # 13. Deploy Pages
      # ------------------------------------------------------------

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


      # ------------------------------------------------------------
      # 14. Показываем URL deployment
      # ------------------------------------------------------------

      - name: Show deployment URL
        run: |
          echo "======================================"
          echo "DEPLOYED TO:"
          echo "======================================"

          echo "${{ steps.deployment.outputs.page_url }}"


