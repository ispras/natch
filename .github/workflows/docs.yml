name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - 'natch_docs_v.3.4.[1-9]*'
      - 'natch_docs_v.3.[5-9]*'
      - 'natch_docs_v.[4-9]*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: documentation-pages
  cancel-in-progress: false


jobs:
  build:
    name: Build and deploy documentation
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ------------------------------------------------------------
      # 1. Получаем весь Git history + tags
      # ------------------------------------------------------------
      - name: Checkout Complete History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------------
      # 3. Dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      # ------------------------------------------------------------
      # 4. Явно обновляем refs
      # ------------------------------------------------------------
      - name: Fetch branches and tags
        run: |
          git fetch origin --prune
          git fetch origin --tags --force

          echo
          echo "Documentation tags:"
          git tag --list 'natch_docs_v.*' | sort -V


      # ------------------------------------------------------------
      # 5. Configure GitHub Pages
      # ------------------------------------------------------------
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # ------------------------------------------------------------
      # 6. Полная сборка всех версий
      # ------------------------------------------------------------
      - name: Build Multi-Version Documentation
        run: |
          rm -rf final_site

          sphinx-multiversion docs final_site


      # ------------------------------------------------------------
      # 7. Проверяем результат sphinx-multiversion
      # ------------------------------------------------------------
      - name: Show Built Versions
        run: |
          echo "===== GENERATED VERSION DIRECTORIES ====="

          find final_site \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%f\n' |
            sort

          echo
          echo "===== CURRENT ROOT ====="

          find final_site \
            -mindepth 1 \
            -maxdepth 1 \
            -printf '%f\n' |
            sort


      # ------------------------------------------------------------
      # 8. Находим последний релиз
      # ------------------------------------------------------------
      - name: Find Latest Release
        run: |

          LATEST_RELEASE=$(
            git tag --list 'natch_docs_v.*' |
            grep -E '^natch_docs_v\.(3\.4\.[1-9][0-9]*|3\.[5-9][0-9]*(\.[0-9]+)?|[4-9][0-9]*(\.[0-9]+)?)$' |
            sort -V |
            tail -n 1
          )

          if [ -z "$LATEST_RELEASE" ]; then
            echo "WARNING: No release tag found."
            LATEST_RELEASE="main"
          fi

          echo "Latest release: $LATEST_RELEASE"

          echo "LATEST_RELEASE=$LATEST_RELEASE" >> "$GITHUB_ENV"


      # ------------------------------------------------------------
      # 9. Проверяем, что релиз действительно собран
      # ------------------------------------------------------------
      - name: Verify Latest Release
        run: |

          RELEASE_INDEX="final_site/${LATEST_RELEASE}/index.html"

          echo "Checking:"
          echo "$RELEASE_INDEX"

          if [ ! -f "$RELEASE_INDEX" ]; then
            echo
            echo "ERROR: Latest release was not generated!"
            echo
            echo "Expected:"
            echo "$RELEASE_INDEX"
            echo
            echo "Available directories:"

            find final_site \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' |
              sort

            exit 1
          fi

          echo
          echo "OK: release exists"
          ls -lh "$RELEASE_INDEX"


      # ------------------------------------------------------------
      # 10. Root redirect
      # ------------------------------------------------------------
      - name: Create Root Redirect
        run: |

          cat > final_site/index.html <<EOF
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">

              <title>Natch documentation</title>

              <meta
                http-equiv="refresh"
                content="0; url=./${LATEST_RELEASE}/index.html"
              >

              <link
                rel="canonical"
                href="./${LATEST_RELEASE}/index.html"
              >
            </head>

            <body>
              <p>
                Redirecting to
                <a href="./${LATEST_RELEASE}/index.html">
                  Natch documentation ${LATEST_RELEASE}
                </a>...
              </p>
            </body>
          </html>
          EOF


      # ------------------------------------------------------------
      # 11. КРИТИЧЕСКАЯ ПРОВЕРКА
      # ------------------------------------------------------------
      - name: Verify Final Site
        run: |

          echo "======================================"
          echo "FINAL SITE ROOT"
          echo "======================================"

          find final_site \
            -mindepth 1 \
            -maxdepth 1 \
            -printf '%f\n' |
            sort

          echo
          echo "======================================"
          echo "LATEST RELEASE"
          echo "======================================"

          echo "$LATEST_RELEASE"

          echo
          echo "======================================"
          echo "RELEASE INDEX"
          echo "======================================"

          ls -lh \
            "final_site/${LATEST_RELEASE}/index.html"

          echo
          echo "======================================"
          echo "ROOT INDEX"
          echo "======================================"

          cat final_site/index.html


      # ------------------------------------------------------------
      # 12. Загружаем ИМЕННО final_site в Pages artifact
      # ------------------------------------------------------------

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: final_site


      # ------------------------------------------------------------
      # 13. Deploy Pages
      # ------------------------------------------------------------

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


      # ------------------------------------------------------------
      # 14. Показываем URL deployment
      # ------------------------------------------------------------

      - name: Show deployment URL
        run: |
          echo "======================================"
          echo "DEPLOYED TO:"
          echo "======================================"

          echo "${{ steps.deployment.outputs.page_url }}"
