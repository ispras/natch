name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - 'natch_docs_v.3.4.[1-9]*'
      - 'natch_docs_v.3.[5-9]*'
      - 'natch_docs_v.[4-9]*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Complete History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Скачиваем всю историю и теги, это критично для sphinx-multiversion

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Load Extant Versions From Storage
        run: |
          # Пытаемся стянуть текущий рабочий сайт из gh-pages во временную папку,
          # чтобы не потерять уже собранные ранее версии релизов.
          git clone --branch gh-pages https://github.com/${{ github.repository }}.git old_site || true

      - name: Build Multi-Version HTML
        run: |
          # sphinx-multiversion собирает каждую версию в docs/_build/html/<имя_ветки_или_тега>
          sphinx-multiversion docs docs/_build/html

      - name: Merge and Create Root Redirect
        run: |
          # Восстанавливаем ранее собранные версии
          if [ -d "old_site" ]; then
            echo "Восстановление ранее собранных версий..."
            cp -r old_site/* docs/_build/html/ || true
            rm -rf docs/_build/html/.git
          fi

          # Пересобираем документацию
          sphinx-multiversion docs docs/_build/html

          # Получаем все теги из репозитория
          git fetch --tags --force

          # Ищем теги вида:
          #   natch_docs_v3.4.1


          LATEST_RELEASE=$(
            git tag --list 'natch_docs_v*' |
            # grep -E '^natch_docs_v\.(3\.4\.[1-9][0-9]*|3\.[5-9][0-9]*\.[0-9]+|[4-9][0-9]*\.[0-9]+\.[0-9]+)$' |
            grep -E '^natch_docs_v\.(3\.4\.[1-9]\d*|3\.[5-9]\d*(\.\d+)?|[4-9]\d*(\.\d+)?)$'
            sort -V |
            tail -n 1
          )


          # Проверяем, что релиз найден
          if [ -z "$LATEST_RELEASE" ]; then
            LATEST_RELEASE="main"
            echo "WARNING: Не найден ни один релизный тег"
            # exit 1
          fi

          echo "Последний релиз: $LATEST_RELEASE"

          # Создаём redirect с корневого URL на последний релиз
          cat <<EOF > docs/_build/html/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Natch documentation</title>
              <meta http-equiv="refresh" content="0; url=./${LATEST_RELEASE}/index.html">
              <link rel="canonical" href="./${LATEST_RELEASE}/index.html">
            </head>
            <body>
              <p>
                Redirecting to
                <a href="./${LATEST_RELEASE}/index.html">
                  Natch documentation ${LATEST_RELEASE}
                </a>...
              </p>
            </body>
          </html>
          EOF

      - name: Save Versions Back to Storage Branch
        uses: Actions-js/push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          directory: docs/_build/html
          force: true
          message: "Добавление/обновление версий документации [skip ci]"


      - name: Upload documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
          overwrite: true

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
